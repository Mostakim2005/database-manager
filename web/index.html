<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Manager — Unified Multi-Domain Portal</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-hover: #21262d;
      --surface-active: #30363d;
      --card-bg: rgba(22, 27, 34, 0.88);
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --amber: #d29922;
      --red: #f85149;
      --purple: #bc8cff;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      line-height: 1.5;
      padding: 0;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .brand-sub { font-size: 13px; color: var(--text-muted); }
    .badge-chip {
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .nav-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .group-cluster {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(13, 17, 23, 0.55);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px 6px;
    }
    .group-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
      padding: 0 6px 0 2px;
      border-right: 1px solid var(--border);
      margin-right: 2px;
    }
    .tab-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }
    .tab-btn:hover { background: var(--surface-hover); color: var(--text); }
    .tab-btn.active {
      background: var(--surface-hover);
      color: var(--accent);
      border-color: var(--border);
      font-weight: 600;
    }

    .quick-links { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .link-btn {
      background: var(--surface-hover);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.18s ease, color 0.18s ease;
    }
    .link-btn:hover { color: #fff; background: var(--surface-active); }

    .stats-strip {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .stats-item span { color: var(--text); font-weight: 600; margin-left: 4px; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 10px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
    .status-pill[data-state="online"] .status-dot { background: var(--green); }
    .status-pill[data-state="offline"] .status-dot { background: var(--red); }

    .main-viewport { flex: 1; position: relative; background: #090d13; min-height: 0; overflow: hidden; }

    .home-view {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding: 24px;
      display: none;
    }
    .home-view.active { display: block; }

    .home-banner {
      background: linear-gradient(135deg, rgba(22, 27, 34, 0.96), rgba(16, 24, 38, 0.96));
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 18px;
    }
    .home-banner h2 { font-size: 20px; margin-bottom: 4px; }
    .home-banner p { font-size: 13px; color: var(--text-muted); }

    .ai-ask-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 20px;
    }
    .ai-ask-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }
    .ai-ask-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .ai-ask-row input {
      flex: 1;
      min-width: 240px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
    }
    .ai-ask-row select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12.5px;
    }
    .btn-primary {
      background: #238636;
      color: #fff;
      border: 1px solid #2ea043;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover:not(:disabled) { background: #2ea043; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .ai-answer-box {
      margin-top: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-size: 13px;
      white-space: pre-wrap;
      display: none;
      max-height: 280px;
      overflow-y: auto;
    }
    .ai-answer-box.open { display: block; }

    .domain-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }
    .domain-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .domain-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .domain-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .domain-card-title { font-size: 16px; font-weight: 700; }
    .domain-card-meta { font-size: 12.5px; color: var(--text-muted); }
    .domain-card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 6px; }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      display: none;
    }
    iframe.active { display: block; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Database Manager</h1>
      <span id="portal-version" class="badge-chip">v2.0.0</span>
      <span class="brand-sub">Registry-Driven Multi-Domain Portal</span>
    </div>

    <div id="nav-tabs" class="nav-tabs" role="tablist" aria-label="Database domains"></div>
    <div id="quick-links" class="quick-links"></div>
  </header>

  <div id="stats-strip" class="stats-strip" aria-live="polite">
    <button id="server-status" class="status-pill" type="button" data-state="checking" title="Click to refresh live API status">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="server-status-text">Checking API…</span>
    </button>
    <div id="dynamic-stats" style="display:contents;"></div>
  </div>

  <div id="main-viewport" class="main-viewport">
    <section id="home-overview" class="home-view" aria-label="Database Manager Main Overview"></section>
  </div>

  <script>
    "use strict";

    /* Offline / file:// fallback manifest mirroring data/registry.json v2.0.0 */
    const FALLBACK_MANIFEST = {
      version: "2.0.0",
      groups: {
        pc_gaming: { display_name: "PC & Gaming", order: 1 },
        ai_models: { display_name: "AI Models", order: 2 },
        media_knowledge: { display_name: "Media & Books", order: 3 },
        mobile: { display_name: "Mobile", order: 4 },
        devops: { display_name: "DevOps", order: 5 }
      },
      domains: [
        { domain: "pc", display_name: "PC Parts & PSU Guard", short_label: "PC", unit_label: "parts", aliases: ["hardware", "cpus", "pc_components"], group: "pc_gaming", tab_order: 1, show_in_portal: true, web_path: "pc/index.html", live_count: 82 },
        { domain: "games", display_name: "Games & Benchmarks", short_label: "Games", unit_label: "titles", aliases: ["gamerank"], group: "pc_gaming", tab_order: 2, show_in_portal: true, web_path: "games/index.html", live_count: 195 },
        { domain: "ai", display_name: "LLM Models & Pricing", short_label: "LLM", unit_label: "models", aliases: ["llms", "ai_models"], group: "ai_models", tab_order: 3, show_in_portal: true, web_path: "ai/index.html", live_count: 48 },
        { domain: "media", display_name: "Media & Adaptations", short_label: "Media", unit_label: "entries", aliases: ["manga", "manhua", "movies", "tv_series", "light_novels"], group: "media_knowledge", tab_order: 4, show_in_portal: true, web_path: "media/index.html", live_count: 124 },
        { domain: "book", display_name: "Book Collection", short_label: "Book", unit_label: "books", aliases: ["books", "learning", "reading"], group: "media_knowledge", tab_order: 5, show_in_portal: true, web_path: "book/index.html", live_count: 3618 },
        { domain: "phone", display_name: "Phone & Mobile", short_label: "Phone", unit_label: "devices", aliases: ["phones", "mobile"], group: "mobile", tab_order: 6, show_in_portal: true, web_path: "phone/index.html", live_count: 4 },
        { domain: "github", display_name: "GitHub Repositories", short_label: "GitHub", unit_label: "repos", aliases: ["repos"], group: "devops", tab_order: 7, show_in_portal: true, web_path: "github/index.html", live_count: 44 }
      ]
    };

    let portalDomains = [];
    let aliasIndex = {};
    let activeTabKey = "home";
    let cachedAgentStatus = null;
    let portalBuildTag = "";

    function resolveTargetTab(raw) {
      const key = String(raw || "").trim().toLowerCase().replace(/^#/, "");
      if (!key || key === "home" || key === "overview" || key === "main") return "home";
      if (aliasIndex[key]) return aliasIndex[key];
      return "home";
    }

    function updatePopOutLink(tab) {
      const popLink = document.getElementById("pop-current-link");
      if (!popLink) return;
      const found = portalDomains.find(d => d.domain === tab);
      if (found) {
        popLink.href = found.web_path || (found.domain + "/index.html");
        popLink.textContent = "Open " + (found.short_label || found.domain) + " Standalone ↗";
        popLink.style.display = "inline-flex";
      } else {
        popLink.style.display = "none";
      }
    }

    function switchTab(rawTab, updateHash = true) {
      const tab = resolveTargetTab(rawTab);
      activeTabKey = tab;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        const active = btn.dataset.tab === tab;
        btn.classList.toggle("active", active);
        btn.setAttribute("aria-selected", active ? "true" : "false");
        btn.setAttribute("tabindex", active ? "0" : "-1");
      });

      const homeView = document.getElementById("home-overview");
      if (homeView) {
        homeView.classList.toggle("active", tab === "home");
      }

      document.querySelectorAll("#main-viewport iframe").forEach(frame => {
        const active = frame.id === "frame-" + tab;
        frame.classList.toggle("active", active);
        if (active && !frame.getAttribute("src") && frame.dataset.src) {
          const sep = frame.dataset.src.includes("?") ? "&" : "?";
          frame.setAttribute("src", portalBuildTag ? (frame.dataset.src + sep + "v=" + encodeURIComponent(portalBuildTag)) : frame.dataset.src);
        }
      });

      updatePopOutLink(tab);
      if (updateHash && window.location.hash !== "#" + tab) {
        history.replaceState(null, "", "#" + tab);
      }
    }

    function renderOverviewHub(domainsList) {
      const home = document.getElementById("home-overview");
      if (!home) return;
      home.replaceChildren();

      const totalRecords = domainsList.reduce((acc, d) => acc + Number(d.live_count ?? d.record_count ?? 0), 0);

      const banner = document.createElement("div");
      banner.className = "home-banner";
      const bannerLeft = document.createElement("div");
      const h2 = document.createElement("h2");
      h2.textContent = "Main Overview — Unified Multi-Domain Hub";
      const p = document.createElement("p");
      p.textContent = domainsList.length + " registered domains · " + totalRecords + " total records · Baseline PC: Ryzen 5 5600GT (Vega 7, 16 GB DDR4, 550W PSU)";
      bannerLeft.appendChild(h2);
      bannerLeft.appendChild(p);

      const bannerRight = document.createElement("div");
      bannerRight.style.display = "flex";
      bannerRight.style.flexWrap = "wrap";
      bannerRight.style.gap = "8px";
      bannerRight.style.alignItems = "center";

      const proxyPill = document.createElement("span");
      proxyPill.id = "home-proxy-pill";
      proxyPill.className = "badge-chip";
      proxyPill.textContent = "CLIProxyAPI: checking...";
      bannerRight.appendChild(proxyPill);

      const startProxyBtn = document.createElement("button");
      startProxyBtn.id = "home-start-proxy-btn";
      startProxyBtn.type = "button";
      startProxyBtn.className = "btn-primary";
      startProxyBtn.style.display = "none";
      startProxyBtn.textContent = "Start CLIProxyAPI";
      startProxyBtn.addEventListener("click", async () => {
        startProxyBtn.disabled = true;
        startProxyBtn.textContent = "Starting...";
        try {
          await fetch("/api/agent/start", { method: "POST" });
        } finally {
          await refreshHomeProxyStatus();
          startProxyBtn.disabled = false;
          startProxyBtn.textContent = "Start CLIProxyAPI";
        }
      });
      bannerRight.appendChild(startProxyBtn);

      banner.appendChild(bannerLeft);
      banner.appendChild(bannerRight);
      home.appendChild(banner);

      /* Cross-Domain AI Ask Card (Charlie 5) */
      const aiCard = document.createElement("div");
      aiCard.className = "ai-ask-card";
      const aiTop = document.createElement("div");
      aiTop.className = "ai-ask-top";
      const aiTitle = document.createElement("strong");
      aiTitle.textContent = "Global Cross-Domain AI Assistant (CLIProxyAPI + Authenticated Google Accounts)";
      const aiAcct = document.createElement("span");
      aiAcct.id = "home-accounts-label";
      aiAcct.style.fontSize = "12px";
      aiAcct.style.color = "var(--text-muted)";
      aiAcct.textContent = "Checking authenticated accounts...";
      aiTop.appendChild(aiTitle);
      aiTop.appendChild(aiAcct);

      const aiRow = document.createElement("div");
      aiRow.className = "ai-ask-row";
      const qInput = document.createElement("input");
      qInput.id = "home-ai-question";
      qInput.type = "text";
      qInput.placeholder = "Ask across PC, Games, LLM, Media, Books, Phones, or GitHub (e.g. 'Which GPUs fit my 550W PSU for Bodycam?')";
      const modelSel = document.createElement("select");
      modelSel.id = "home-ai-model";
      const defOpt = document.createElement("option");
      defOpt.value = "";
      defOpt.textContent = "Auto Model";
      modelSel.appendChild(defOpt);
      const askBtn = document.createElement("button");
      askBtn.type = "button";
      askBtn.className = "btn-primary";
      askBtn.textContent = "Ask Agent";

      const ansBox = document.createElement("div");
      ansBox.id = "home-ai-answer";
      ansBox.className = "ai-answer-box";

      async function runHomeAsk() {
        const q = qInput.value.trim();
        if (!q) return;
        askBtn.disabled = true;
        askBtn.textContent = "Thinking...";
        ansBox.classList.add("open");
        ansBox.textContent = "Querying CLIProxyAPI across domain catalogs...";
        try {
          const res = await fetch("/api/agent/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: q, model: modelSel.value })
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error(data.error || ("HTTP " + res.status));
          ansBox.textContent = "[" + (data.model || "model") + "]\n\n" + (data.content || "");
        } catch (err) {
          ansBox.textContent = "Agent error: " + err.message;
        } finally {
          askBtn.disabled = false;
          askBtn.textContent = "Ask Agent";
        }
      }
      askBtn.addEventListener("click", runHomeAsk);
      qInput.addEventListener("keydown", e => { if (e.key === "Enter") runHomeAsk(); });

      aiRow.appendChild(qInput);
      aiRow.appendChild(modelSel);
      aiRow.appendChild(askBtn);
      aiCard.appendChild(aiTop);
      aiCard.appendChild(aiRow);
      aiCard.appendChild(ansBox);
      home.appendChild(aiCard);

      /* Domain Cards Grid */
      const grid = document.createElement("div");
      grid.className = "domain-grid";
      domainsList.forEach((d, idx) => {
        const card = document.createElement("div");
        card.className = "domain-card";

        const head = document.createElement("div");
        head.className = "domain-card-head";
        const title = document.createElement("div");
        title.className = "domain-card-title";
        title.textContent = d.display_name || d.domain;
        const grp = document.createElement("span");
        grp.className = "badge-chip";
        grp.textContent = d.group_display_name || d.group || "Domain";
        head.appendChild(title);
        head.appendChild(grp);

        const cnt = d.live_count !== undefined && d.live_count !== null ? d.live_count : d.record_count;
        const meta = document.createElement("div");
        meta.className = "domain-card-meta";
        const freshness = d.compiled ? (d.is_stale ? "Stale SQLite" : "SQLite Ready") : "JSON Active";
        meta.textContent = (cnt ?? "--") + " " + (d.unit_label || "records") + " · Shortcut [" + (idx + 1) + "] · " + freshness;

        const actions = document.createElement("div");
        actions.className = "domain-card-actions";
        const openTabBtn = document.createElement("button");
        openTabBtn.type = "button";
        openTabBtn.className = "btn-primary";
        openTabBtn.textContent = "Open in Portal";
        openTabBtn.addEventListener("click", () => switchTab(d.domain));

        const openSolo = document.createElement("a");
        openSolo.className = "link-btn";
        openSolo.href = d.web_path || (d.domain + "/index.html");
        openSolo.textContent = "Open Page ↗";

        actions.appendChild(openTabBtn);
        actions.appendChild(openSolo);
        card.appendChild(head);
        card.appendChild(meta);
        card.appendChild(actions);
        grid.appendChild(card);
      });
      home.appendChild(grid);

      if (cachedAgentStatus) applyAgentStatusToHome(cachedAgentStatus);
    }

    function applyAgentStatusToHome(st) {
      const pill = document.getElementById("home-proxy-pill");
      const startBtn = document.getElementById("home-start-proxy-btn");
      const acctLbl = document.getElementById("home-accounts-label");
      const modelSel = document.getElementById("home-ai-model");
      if (!pill || !st) return;

      pill.textContent = st.online
        ? ("CLIProxyAPI Online (" + (st.models ? st.models.length : 0) + " models)")
        : "CLIProxyAPI Offline (:8317)";
      pill.style.borderColor = st.online ? "var(--green)" : "var(--amber)";
      pill.style.color = st.online ? "var(--green)" : "var(--amber)";

      if (startBtn) {
        startBtn.style.display = (!st.online && st.can_auto_start) ? "inline-flex" : "none";
      }
      if (acctLbl) {
        acctLbl.textContent = (st.google_account_count || 0) + " Google / Antigravity accounts connected";
      }
      if (modelSel) {
        modelSel.replaceChildren();
        if (Array.isArray(st.models) && st.models.length) {
          st.models.forEach(m => {
            const opt = document.createElement("option");
            opt.value = m;
            opt.textContent = m;
            if (m === st.default_model) opt.selected = true;
            modelSel.appendChild(opt);
          });
        } else {
          const opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "Auto Model";
          modelSel.appendChild(opt);
        }
      }
    }

    async function refreshHomeProxyStatus() {
      try {
        const res = await fetch("/api/agent/status", { cache: "no-store" });
        if (!res.ok) return;
        cachedAgentStatus = await res.json();
        applyAgentStatusToHome(cachedAgentStatus);
      } catch (_) {}
    }

    function buildPortalChrome(groupsMeta, domainsList) {
      portalDomains = domainsList
        .filter(d => d && d.show_in_portal !== false)
        .sort((a, b) => Number(a.tab_order || 999) - Number(b.tab_order || 999));

      aliasIndex = {};
      portalDomains.forEach(d => {
        aliasIndex[d.domain.toLowerCase()] = d.domain;
        if (d.display_name) aliasIndex[String(d.display_name).toLowerCase()] = d.domain;
        if (d.short_label) aliasIndex[String(d.short_label).toLowerCase()] = d.domain;
        (d.aliases || []).forEach(a => {
          aliasIndex[String(a).toLowerCase()] = d.domain;
        });
      });

      const nav = document.getElementById("nav-tabs");
      const links = document.getElementById("quick-links");
      const stats = document.getElementById("dynamic-stats");
      const viewport = document.getElementById("main-viewport");
      const homeView = document.getElementById("home-overview");

      nav.replaceChildren();
      links.replaceChildren();
      stats.replaceChildren();
      Array.from(viewport.querySelectorAll("iframe")).forEach(f => f.remove());

      /* Main Overview Home tab (Shortcut 0) */
      const homeCluster = document.createElement("div");
      homeCluster.className = "group-cluster";
      const homeBtn = document.createElement("button");
      homeBtn.id = "tab-home";
      homeBtn.className = "tab-btn";
      homeBtn.type = "button";
      homeBtn.setAttribute("role", "tab");
      homeBtn.setAttribute("aria-selected", "false");
      homeBtn.setAttribute("aria-controls", "home-overview");
      homeBtn.setAttribute("tabindex", "-1");
      homeBtn.dataset.tab = "home";
      homeBtn.title = "Main Overview Hub (Shortcut: 0)";
      homeBtn.textContent = "Overview";
      homeBtn.addEventListener("click", () => switchTab("home"));
      homeCluster.appendChild(homeBtn);
      nav.appendChild(homeCluster);

      /* Group domains in registry group order */
      const buckets = [];
      const bucketMap = {};
      portalDomains.forEach(d => {
        const gid = d.group || "general";
        if (!bucketMap[gid]) {
          const gInfo = (groupsMeta && groupsMeta[gid]) || {};
          bucketMap[gid] = {
            id: gid,
            label: d.group_display_name || gInfo.display_name || gid,
            order: Number(d.group_order || gInfo.order || 99),
            items: []
          };
          buckets.push(bucketMap[gid]);
        }
        bucketMap[gid].items.push(d);
      });
      buckets.sort((a, b) => a.order - b.order);

      let tabIndexCounter = 0;
      buckets.forEach(bucket => {
        const cluster = document.createElement("div");
        cluster.className = "group-cluster";
        const gLabel = document.createElement("span");
        gLabel.className = "group-tag";
        gLabel.textContent = bucket.label;
        cluster.appendChild(gLabel);

        bucket.items.forEach(d => {
          tabIndexCounter += 1;
          const btn = document.createElement("button");
          btn.id = "tab-" + d.domain;
          btn.className = "tab-btn";
          btn.type = "button";
          btn.setAttribute("role", "tab");
          btn.setAttribute("aria-selected", "false");
          btn.setAttribute("aria-controls", "frame-" + d.domain);
          btn.setAttribute("tabindex", "-1");
          btn.dataset.tab = d.domain;
          btn.title = (d.display_name || d.domain) + " (Shortcut: " + tabIndexCounter + ")";
          btn.textContent = d.short_label || d.display_name || d.domain;
          btn.addEventListener("click", () => switchTab(d.domain));
          cluster.appendChild(btn);

          const statItem = document.createElement("div");
          statItem.className = "stats-item";
          statItem.textContent = (d.short_label || d.display_name || d.domain) + ":";
          const valSpan = document.createElement("span");
          valSpan.id = "stat-" + d.domain;
          const cnt = d.live_count !== undefined && d.live_count !== null ? d.live_count : d.record_count;
          valSpan.textContent = (cnt !== undefined && cnt !== null ? cnt : "--") + " " + (d.unit_label || "records");
          statItem.appendChild(valSpan);
          stats.appendChild(statItem);

          const frame = document.createElement("iframe");
          frame.id = "frame-" + d.domain;
          frame.title = d.display_name || d.domain;
          frame.dataset.src = d.web_path || (d.domain + "/index.html");
          frame.setAttribute("role", "tabpanel");
          frame.setAttribute("aria-labelledby", btn.id);
          viewport.appendChild(frame);
        });
        nav.appendChild(cluster);
      });

      const popCur = document.createElement("a");
      popCur.id = "pop-current-link";
      popCur.className = "link-btn";
      popCur.href = "pc/index.html";
      popCur.style.display = "none";
      popCur.textContent = "Open Standalone ↗";
      links.appendChild(popCur);

      const apiLink = document.createElement("a");
      apiLink.className = "link-btn";
      apiLink.href = "/api/status";
      apiLink.target = "_blank";
      apiLink.rel = "noopener noreferrer";
      apiLink.textContent = "JSON API ↗";
      links.appendChild(apiLink);

      const sysStat = document.createElement("div");
      sysStat.className = "stats-item";
      sysStat.textContent = "Baseline PC:";
      const sysVal = document.createElement("span");
      sysVal.style.color = "var(--green)";
      sysVal.textContent = "Ryzen 5 5600GT (Vega 7, 550W PSU)";
      sysStat.appendChild(sysVal);
      stats.appendChild(sysStat);

      renderOverviewHub(portalDomains);

      /* Arrow-key roving focus across all tabs including Overview */
      const buttons = Array.from(document.querySelectorAll(".tab-btn"));
      buttons.forEach((btn, idx) => {
        btn.addEventListener("keydown", e => {
          if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
            e.preventDefault();
            const next = (idx + (e.key === "ArrowRight" ? 1 : -1) + buttons.length) % buttons.length;
            buttons[next].focus();
            switchTab(buttons[next].dataset.tab);
          }
        });
      });

      if (!homeView.dataset.initialized) {
        homeView.dataset.initialized = "1";
      }
      switchTab(window.location.hash, false);
    }

    async function loadPortalStatus() {
      const pill = document.getElementById("server-status");
      const label = document.getElementById("server-status-text");
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (data.version) {
          document.getElementById("portal-version").textContent = "v" + data.version;
        }
        if (data.server_build) {
          portalBuildTag = String(data.server_build);
        }
        const groups = (data.registry && data.registry.groups) || FALLBACK_MANIFEST.groups;
        const domains = Array.isArray(data.domains) && data.domains.length ? data.domains : FALLBACK_MANIFEST.domains;
        buildPortalChrome(groups, domains);
        const caps = data.capabilities || {};
        if (!caps.github_async_refresh || !caps.media_async_refresh) {
          pill.dataset.state = "checking";
          label.textContent = "API Online (Outdated server.py — Restart start-server.bat)";
        } else {
          pill.dataset.state = "online";
          label.textContent = "API Online (" + window.location.host + ")";
        }
        refreshHomeProxyStatus();
      } catch (_) {
        buildPortalChrome(FALLBACK_MANIFEST.groups, FALLBACK_MANIFEST.domains);
        pill.dataset.state = "offline";
        label.textContent = "Static / Offline Mode";
      }
    }

    document.addEventListener("keydown", e => {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      const tag = (document.activeElement && document.activeElement.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (e.key === "0") {
        switchTab("home");
        return;
      }
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= portalDomains.length) {
        switchTab(portalDomains[num - 1].domain);
      }
    });

    document.getElementById("server-status").addEventListener("click", loadPortalStatus);

    window.addEventListener("hashchange", () => {
      switchTab(window.location.hash, false);
    });

    window.addEventListener("DOMContentLoaded", () => {
      buildPortalChrome(FALLBACK_MANIFEST.groups, FALLBACK_MANIFEST.domains);
      loadPortalStatus();
    });
  </script>
</body>
</html>
